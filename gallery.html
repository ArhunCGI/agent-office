<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Office — Galerie</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; padding: 24px; background: #110d1a; color: #f3e3c3; font: 13px/1.4 ui-monospace, Menlo, monospace; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      h2 { font-size: 15px; margin: 32px 0 8px; color: #ffd37a; border-bottom: 1px solid #3e2c41; padding-bottom: 4px; }
      h3 { font-size: 13px; margin: 16px 0 6px; color: #f0a07e; }
      p.note { color: #b9a6b8; margin: 0 0 12px; max-width: 900px; }
      .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
      .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
      .cell span { color: #b9a6b8; font-size: 11px; }
      .grid { display: grid; gap: 6px 14px; align-items: end; justify-items: center; }
      .grid .h { color: #b9a6b8; font-size: 11px; justify-self: start; }
      .swatch { width: 40px; height: 40px; border: 1px solid #000; }
      canvas { image-rendering: pixelated; display: block; background: #1f1830; }
      .scene canvas { background: none; }
    </style>
  </head>
  <body>
    <h1>Agent Office — galerie de design</h1>
    <p class="note">Tous les sprites sont générés en code (aucun fichier image). Les choix subjectifs sont proposés en deux variantes : A/B.</p>
    <div id="app"></div>
    <script type="module" src="/src/gallery.ts"></script>
  </body>
</html>
